<svg xmlns="http://www.w3.org/2000/svg" width="676" height="430" viewBox="0 0 676 430">
  <rect width="676" height="430" fill="#ffffff"/>
  <rect width="676" height="48" fill="#eeeeee"/>
  <text x="24" y="31" fill="#222222" font-family="Arial, sans-serif" font-size="20">›_ Exhibit</text>
  <text x="28" y="84" font-family="Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#16a34a">R1#</tspan><tspan fill="#111111"> show ip ospf interface GigabitEthernet0/0</tspan></text>
  <text x="28" y="110" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">GigabitEthernet0/0 is up, line protocol is up</text>
  <text x="28" y="136" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Internet Address 192.168.1.1/24, Area 0</text>
  <text x="28" y="162" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Process ID 1, Router ID 1.1.1.1, Network Type BROADCAST, Cost: 1</text>
  <text x="28" y="188" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Transmit Delay is 1 sec, State DR, Priority 1</text>
  <text x="28" y="214" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Hello 10, Dead 40, Wait 40, Retransmit 5</text>
  <text x="28" y="266" font-family="Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#16a34a">R2#</tspan><tspan fill="#111111"> show ip ospf interface GigabitEthernet0/0</tspan></text>
  <text x="28" y="292" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">GigabitEthernet0/0 is up, line protocol is up</text>
  <text x="28" y="318" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Internet Address 192.168.1.2/24, Area 1</text>
  <text x="28" y="344" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Process ID 1, Router ID 2.2.2.2, Network Type BROADCAST, Cost: 1</text>
  <text x="28" y="370" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Transmit Delay is 1 sec, State DR, Priority 1</text>
  <text x="28" y="396" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">  Hello 10, Dead 40, Wait 40, Retransmit 5</text>
</svg>
