<svg xmlns="http://www.w3.org/2000/svg" width="560" height="222" viewBox="0 0 560 222">
  <rect width="560" height="222" fill="#ffffff"/>
  <rect width="560" height="48" fill="#eeeeee"/>
  <text x="24" y="31" fill="#222222" font-family="Arial, sans-serif" font-size="20">›_ Exhibit</text>
  <text x="28" y="84" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">ip access-list extended SECURITY-ACL</text>
  <text x="28" y="110" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve"> 10 permit tcp 192.168.10.0 0.0.0.255 any eq 443</text>
  <text x="28" y="136" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve"> 20 permit tcp 192.168.10.0 0.0.0.255 any eq 80</text>
  <text x="28" y="162" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve"> 30 permit icmp 192.168.10.0 0.0.0.255 any echo-reply</text>
  <text x="28" y="188" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve"> 40 deny ip any any log</text>
</svg>
