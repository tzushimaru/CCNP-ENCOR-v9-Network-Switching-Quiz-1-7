<svg xmlns="http://www.w3.org/2000/svg" width="560" height="248" viewBox="0 0 560 248">
  <rect width="560" height="248" fill="#ffffff"/>
  <rect width="560" height="48" fill="#eeeeee"/>
  <text x="24" y="31" fill="#222222" font-family="Arial, sans-serif" font-size="20">›_ Python</text>
  <text x="28" y="84" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">devices = ['router1', 'switch1', 'firewall1']</text>
  <text x="28" y="110" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">for index, device in enumerate(devices):</text>
  <text x="28" y="136" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">    if 'switch' in device:</text>
  <text x="28" y="162" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">        print(f'Device {index}: {device.upper()}')</text>
  <text x="28" y="188" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">    else:</text>
  <text x="28" y="214" fill="#111111" font-family="Consolas, monospace" font-size="17" xml:space="preserve">        print(f'Device {index}: {device}')</text>
</svg>
