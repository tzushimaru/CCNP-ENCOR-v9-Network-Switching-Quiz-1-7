<!doctype html>
<html lang="cs">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Network Switching Quiz</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app-shell">
		<header class="topbar">
			<div><p class="eyebrow">CCNP ENCOR v9</p><h1>Network Switching Quiz</h1></div>
			<button id="restart-button" class="button button-quiet" type="button">Restart</button>
		</header>
		<section class="progress-panel" aria-label="Progress"><div class="progress-copy"><span id="stage-label">Blok 1 z 3</span><strong id="progress-label">0 / 20</strong></div><div class="progress-track"><span id="progress-bar"></span></div><div id="stage-tabs" class="stage-tabs"></div></section>
		<section class="settings-panel" aria-label="Nastavení"><strong>Nastavení běhu</strong><label><input id="random-questions" type="checkbox"> Náhodné otázky</label><label><input id="random-answers" type="checkbox"> Náhodné odpovědi</label><label><input id="only-wrong" type="checkbox"> Pouze chybné otázky</label><span id="save-status" class="save-status">Průběh se ukládá automaticky</span></section>
		<section id="quiz-view" class="quiz-layout"><div class="question-column"><div class="question-meta"><span id="question-number">Otázka 1</span><span id="question-type">Jedna správná odpověď</span></div><article class="question-card"><h2 id="question-text"></h2><div id="question-media"></div><form id="answer-form" class="answers"></form><div id="feedback" class="feedback" aria-live="polite"></div><div id="explanation" class="explanation" aria-live="polite" hidden></div><div class="question-actions"><button id="check-button" class="button button-primary" type="button">Zkontrolovat</button><button id="skip-button" class="button button-outline" type="button">Nevím, zopakovat později</button></div></article></div><aside class="session-panel"><div class="session-heading"><span class="status-dot"></span><span>Aktuální běh</span></div><div class="stat-grid"><div><span>Správně</span><strong id="correct-count">0</strong></div><div><span>Opakovat</span><strong id="retry-count">0</strong></div></div><div class="rule-list"><p><span class="rule-mark rule-mark-green"></span>Správná odpověď pokračuje dál</p><p><span class="rule-mark rule-mark-amber"></span>Nejisté otázky se vrací</p></div><button id="overview-button" class="button button-outline button-full" type="button">Přehled otázek</button></aside></section>
		<section id="complete-view" class="complete-view" hidden><p class="eyebrow">Hotovo</p><h2>Blok je dokončený.</h2><p id="complete-summary"></p><div class="complete-actions"><button id="next-stage-button" class="button button-primary" type="button">Pokračovat na další blok</button><button id="retry-errors-button" class="button button-outline" type="button" hidden>Opakovat pouze chyby</button></div></section>
		<section id="overview-view" class="overview-view" hidden><div class="overview-header"><div><p class="eyebrow">Mapa běhu</p><h2>Přehled otázek</h2></div><button id="close-overview-button" class="button button-quiet" type="button">Zpět ke kvízu</button></div><div id="overview-grid" class="overview-grid"></div></section>
	</main>
	<script src="app.js"></script>
</body>
</html>
